<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>countup tests</title>
<meta name="description" content="In-page tests for the countup logic in countup.js.">
<style>
body {
  margin: 0;
  padding: 1.5rem;
  background: #fbfaf7;
  color: #141414;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.875rem;
  line-height: 1.5;
}
h1 { font-size: 1.25rem; margin: 0 0 1rem; }
#count { font-size: 1.5rem; font-weight: 700; }
ul { padding-left: 1.25rem; }
li { overflow-wrap: anywhere; }
.fail { color: #8c1d18; }
</style>
</head>
<body>
<h1>countup tests</h1>
<p id="count">running…</p>
<p id="zone"></p>
<ul id="failures"></ul>

<script src="countup.js"></script>
<script>
(function () {
  'use strict';

  var C = window.Countup;
  var passed = 0, failed = 0, failures = [];

  function test(name, fn) {
    try {
      fn();
      passed++;
    } catch (e) {
      failed++;
      failures.push(name + ' — ' + (e && e.message ? e.message : String(e)));
    }
  }

  function eq(actual, expected, what) {
    if (actual !== expected) {
      throw new Error((what || '') + ' expected ' + JSON.stringify(expected) +
        ', got ' + JSON.stringify(actual));
    }
  }

  function ok(value, what) {
    if (!value) throw new Error(what || 'expected truthy, got ' + value);
  }

  function has(list, fragment) {
    for (var i = 0; i < list.length; i++) {
      if (list[i].indexOf(fragment) !== -1) return;
    }
    throw new Error('no note containing ' + JSON.stringify(fragment) +
      ' in ' + JSON.stringify(list));
  }

  /* Calendar days between two ISO dates, each carried as its UTC midnight. */
  function days(a, b) {
    return C.wholeDays(C.parseDate(a), C.parseDate(b));
  }

  /* Independent expectation: UTC has no DST, so a UTC millisecond quotient
     is an exact whole-day count to compare the local arithmetic against. */
  function utcDays(a, b) {
    var x = a.split('-'), y = b.split('-');
    return (Date.UTC(+y[0], +y[1] - 1, +y[2]) -
            Date.UTC(+x[0], +x[1] - 1, +x[2])) / 86400000;
  }

  function localMidnight(y, m, d) {
    return new Date(y, m - 1, d).getTime();
  }

  /* ---- strict date parsing ------------------------------------------- */

  /* parseDate hands back the Date whose UTC midnight is that calendar day —
     a calendar day is not a local instant, and in some zones there is no
     local instant for it at all (Samoa had no 2011-12-30). */
  test('parseDate accepts a plain date', function () {
    var d = C.parseDate('2026-08-14');
    ok(d instanceof Date, 'a Date');
    eq(d.getUTCFullYear(), 2026); eq(d.getUTCMonth(), 7); eq(d.getUTCDate(), 14);
  });

  test('parseDate rejects 2026-02-31 instead of rolling into March',
    function () { eq(C.parseDate('2026-02-31'), null); });

  test('parseDate rejects 2026-02-29 (not a leap year)',
    function () { eq(C.parseDate('2026-02-29'), null); });

  test('parseDate accepts 2024-02-29',
    function () { eq(C.parseDate('2024-02-29').getUTCDate(), 29); });

  test('parseDate accepts 2000-02-29 (leap century)',
    function () { eq(C.parseDate('2000-02-29').getUTCMonth(), 1); });

  test('parseDate rejects 1900-02-29 (common century)',
    function () { eq(C.parseDate('1900-02-29'), null); });

  test('parseDate rejects April 31',
    function () { eq(C.parseDate('2026-04-31'), null); });

  test('parseDate rejects month 00 and month 13', function () {
    eq(C.parseDate('2026-00-10'), null);
    eq(C.parseDate('2026-13-10'), null);
  });

  test('parseDate rejects day 00', function () {
    eq(C.parseDate('2026-01-00'), null);
  });

  test('parseDate rejects loose or padded shapes', function () {
    var bad = ['banana', '', '2026-1-1', '20260101', '2026/01/01',
      ' 2026-01-01', '2026-01-01 ', '2026-01-01T00:00', '99999-01-01',
      '-2026-01-01', 'NaN', 'Invalid Date', '2026-01-0a'];
    for (var i = 0; i < bad.length; i++) {
      eq(C.parseDate(bad[i]), null, bad[i]);
    }
  });

  test('parseDate rejects non-strings', function () {
    eq(C.parseDate(null), null);
    eq(C.parseDate(undefined), null);
    eq(C.parseDate(20260101), null);
    eq(C.parseDate({}), null);
  });

  /* The date field cannot hold year 0000, so nothing else may either:
     #d=0000-01-01 used to render 740207 days over an empty field, and the
     next keystroke dropped the date without a word. */
  test('parseDate rejects year 0000', function () {
    eq(C.parseDate('0000-01-01'), null);
    eq(C.parseDate('0000-12-31'), null);
    eq(C.parseDate('0001-01-01').getUTCFullYear(), 1);
  });

  test('a hash date the field cannot hold is refused, not rendered',
    function () {
      var r = C.parseHash('#d=0000-01-01');
      eq(r.date, '');
      has(r.notes, 'not a real date');
    });

  /* Samoa has no local 2011-12-30 at any hour, so a local Date built for it
     lands on the 31st. A calendar day is not an instant. */
  test('parseDate accepts a day that has no local instant', function () {
    var d = C.parseDate('2011-12-30');
    ok(d !== null, 'accepted');
    eq(d.getUTCFullYear(), 2011); eq(d.getUTCMonth(), 11);
    eq(d.getUTCDate(), 30);
    eq(C.parseDate('1994-12-31').getUTCDate(), 31);
  });

  test('parseDate keeps two-digit years as years 0001-0099', function () {
    var d = C.parseDate('0099-01-02');
    eq(d.getUTCFullYear(), 99);
    eq(days('0099-01-02', '0099-01-03'), 1);
  });

  /* ---- what to say about a date field that gives nothing --------------- */

  /* Blink reports value === '' with badInput for an emptied field, a
     half-typed one and a complete impossible one alike, and hands the page
     no way to tell the last two apart. The page used to count keystrokes;
     the segments can be filled in any order, so the count was wrong in both
     directions. One sentence covers both, and it is true of both. */
  var UNKNOWN = 'That date is not complete or not real \u2014 pick one below.';

  test('a field the browser refuses is not diagnosed beyond the evidence',
    function () {
      eq(C.dateNote('', true), UNKNOWN);
    });

  /* 02/31/2026 on screen: two digits typed, a complete impossible date. The
     old count said "Finish the date", which was false. */
  test('a complete impossible date typed in two keystrokes is not called ' +
    'unfinished', function () {
      var note = C.dateNote('', true);
      ok(note.indexOf('Finish') === -1, 'claims unfinished: ' + note);
    });

  /* 12/31/____ on screen after eight digits: the old count called it unreal,
     which was false as well. */
  test('an unfinished date typed in eight keystrokes is not called unreal',
    function () {
      var note = C.dateNote('', true);
      ok(note.indexOf('not a real date') === -1, 'claims unreal: ' + note);
    });

  test('the one sentence names both of the cases it covers', function () {
    ok(UNKNOWN.indexOf('not complete') !== -1, UNKNOWN);
    ok(UNKNOWN.indexOf('not real') !== -1, UNKNOWN);
  });

  test('text the browser does hand over is still diagnosed', function () {
    eq(C.dateNote('2026-02-29', false),
      'That is not a real date. Pick another one.');
    eq(C.dateNote('2026-02-29', true),
      'That is not a real date. Pick another one.');
  });

  test('an untouched empty field is asked for a date', function () {
    eq(C.dateNote('', false), 'Pick a date to start the counter.');
    eq(C.dateNote(null, false), 'Pick a date to start the counter.');
    eq(C.dateNote(undefined, false), 'Pick a date to start the counter.');
  });

  test('a year the counter cannot show is named as the year', function () {
    var msg = 'That year is out of range. Use a year between 0001 and 9999.';
    eq(C.dateNote('20260-01-01', true), msg);
    eq(C.dateNote('123456-01-01', false), msg);
    eq(C.dateNote('0000-01-01', false), msg);
  });

  test('no date note ever mentions the year unless the year is the problem',
    function () {
      var cases = [['', true], ['', false], ['2026-02-31', false],
        ['2026-13-01', false]];
      for (var k = 0; k < cases.length; k++) {
        var note = C.dateNote(cases[k][0], cases[k][1]);
        ok(note.indexOf('year') === -1, 'year in ' + note);
        ok(note.indexOf('NaN') === -1, 'NaN in ' + note);
        ok(note.charAt(note.length - 1) === '.', 'a sentence: ' + note);
      }
    });

  /* ---- whole days across DST and the dateline -------------------------- */

  /* These spans each straddle a real transition somewhere in the world. The
     answers are calendar answers, so they hold whatever zone the page runs
     in; the suite is also driven under several zones by the headless runner
     (Pacific/Apia, Pacific/Kiritimati, Pacific/Chatham +12:45/+13:45,
     Australia/Lord_Howe +10:30/+11:00, America/Santiago, America/New_York,
     Europe/London, Asia/Kolkata, UTC).

     The last two are dateline jumps, not DST: Samoa deleted 2011-12-30 and
     Kiritimati deleted 1994-12-31, so those local days are 24 hours short
     and any answer built out of elapsed time is one day light. */
  var dstSpans = [
    ['2026-03-07', '2026-03-09', 2],   // US spring forward, 23 h day
    ['2026-03-08', '2026-03-09', 1],
    ['2026-10-31', '2026-11-02', 2],   // US fall back, 25 h day
    ['2026-11-01', '2026-11-02', 1],
    ['2026-03-28', '2026-03-30', 2],   // EU spring forward
    ['2026-10-24', '2026-10-26', 2],   // EU fall back
    ['2026-04-04', '2026-04-06', 2],   // AU / Lord Howe fall back
    ['2026-10-03', '2026-10-05', 2],   // AU / Lord Howe spring forward
    ['2026-04-04', '2026-04-06', 2],   // NZ / Chatham fall back
    ['2026-09-05', '2026-09-07', 2],   // Chile spring forward
    ['2026-03-08', '2026-11-02', 239], // both US transitions in one span
    ['1969-07-20', '2026-08-14', 20844],
    ['2011-12-29', '2011-12-31', 2],   // Samoa: no 2011-12-30 at all
    ['2011-12-29', '2012-01-02', 4],
    ['1994-12-30', '1995-01-01', 2],   // Kiritimati: no 1994-12-31
    ['1969-07-20', '2023-01-01', 19523]
  ];
  for (var i = 0; i < dstSpans.length; i++) {
    (function (span) {
      test('whole days ' + span[0] + ' → ' + span[1], function () {
        eq(days(span[0], span[1]), span[2]);
        eq(days(span[1], span[0]), -span[2], 'reversed');
        eq(utcDays(span[0], span[1]), span[2], 'independent UTC check');
      });
    })(dstSpans[i]);
  }

  test('local day arithmetic matches UTC day arithmetic for 2000 random ' +
    'pairs between 1970 and 2100', function () {
    var seed = 20260814;
    function rnd() {
      seed = (seed * 1103515245 + 12345) % 2147483648;
      return seed / 2147483648;
    }
    function pick() {
      var y = 1970 + Math.floor(rnd() * 131);
      var m = 1 + Math.floor(rnd() * 12);
      var dim = new Date(y, m, 0).getDate();
      var d = 1 + Math.floor(rnd() * dim);
      return y + '-' + (m < 10 ? '0' : '') + m + '-' + (d < 10 ? '0' : '') + d;
    }
    for (var k = 0; k < 2000; k++) {
      var a = pick(), b = pick();
      eq(days(a, b), utcDays(a, b), a + ' → ' + b);
    }
  });

  test('leap day spans', function () {
    eq(days('2024-02-28', '2024-03-01'), 2);
    eq(days('2023-02-28', '2023-03-01'), 1);
    eq(days('2024-01-01', '2025-01-01'), 366);
    eq(days('2023-01-01', '2024-01-01'), 365);
    eq(days('2000-01-01', '2001-01-01'), 366);
    eq(days('1900-01-01', '1901-01-01'), 365);
  });

  /* ---- daysFrom, relative to a moment --------------------------------- */

  test('daysFrom reads 0 for today whatever the hour', function () {
    eq(C.daysFrom(localMidnight(2026, 8, 14), '2026-08-14'), 0);
    eq(C.daysFrom(localMidnight(2026, 8, 14) + 1000, '2026-08-14'), 0);
    eq(C.daysFrom(localMidnight(2026, 8, 15) - 1000, '2026-08-14'), 0);
  });

  test('daysFrom is negative in the past, positive in the future',
    function () {
      var now = localMidnight(2026, 8, 14) + 13 * 3600000;
      eq(C.daysFrom(now, '2026-08-13'), -1);
      eq(C.daysFrom(now, '2026-08-15'), 1);
      eq(C.daysFrom(now, '1969-07-20'), -20844);
      eq(C.daysFrom(now, '2027-08-14'), 365);
    });

  test('daysFrom returns null for a date it cannot trust', function () {
    eq(C.daysFrom(Date.now(), 'banana'), null);
    eq(C.daysFrom(Date.now(), '2026-02-31'), null);
    eq(C.daysFrom(Date.now(), ''), null);
  });

  /* The repro that started this: under Pacific/Apia, a millisecond quotient
     between two local midnights reads 19522 because Samoa's missing day is
     counted as one that happened. Every calendar says 19523. */
  test('daysFrom is right across a dateline jump', function () {
    eq(C.daysFrom(new Date(2023, 0, 1, 12, 0, 0).getTime(), '1969-07-20'),
      -19523);
    eq(C.daysFrom(new Date(2011, 11, 29, 12, 0, 0).getTime(), '2011-12-31'),
      2, 'Samoa deleted 2011-12-30');
    eq(C.daysFrom(new Date(1994, 11, 30, 12, 0, 0).getTime(), '1995-01-01'),
      2, 'Kiritimati deleted 1994-12-31');
  });

  /* Hourly for four years: whatever the local clock did in the night — a
     DST shift, a half-hour offset change, a whole day deleted — the day the
     visitor is standing in has to read as today, and tomorrow as one day. */
  test('every hour of 2010-2014 reads its own local day as today',
    function () {
      var bad = 0, first = '';
      for (var t = Date.UTC(2010, 0, 1); t < Date.UTC(2014, 0, 1);
           t += 3600000) {
        var d = new Date(t);
        var iso = d.getFullYear() + '-' +
          (d.getMonth() < 9 ? '0' : '') + (d.getMonth() + 1) + '-' +
          (d.getDate() < 10 ? '0' : '') + d.getDate();
        if (C.daysFrom(t, iso) !== 0) {
          bad++;
          if (!first) first = iso + ' at ' + d.toString();
        }
      }
      eq(bad, 0, 'mismatched hours (first: ' + first + ')');
    });

  test('daysFrom is right across a spring-forward run of days', function () {
    var start = localMidnight(2026, 3, 6);
    for (var k = 0; k < 6; k++) {
      var now = start + k * 86400000 + 12 * 3600000;
      /* Adding 24 h can land on 11:00 or 13:00 across a transition, so
         re-read the local day rather than assuming. */
      var d = new Date(now);
      var iso = d.getFullYear() + '-' +
        (d.getMonth() < 9 ? '0' : '') + (d.getMonth() + 1) + '-' +
        (d.getDate() < 10 ? '0' : '') + d.getDate();
      eq(C.daysFrom(now, iso), 0, iso);
    }
  });

  /* ---- the ticking line ----------------------------------------------- */

  test('untilNextMidnight lands exactly on the next local midnight',
    function () {
      var samples = [
        localMidnight(2026, 6, 15) + 13 * 3600000 + 20 * 60000 + 15000,
        localMidnight(2026, 3, 8) + 3600000,
        localMidnight(2026, 11, 1) + 20 * 3600000,
        localMidnight(2026, 1, 1)
      ];
      for (var k = 0; k < samples.length; k++) {
        var now = samples[k];
        var d = new Date(now);
        var next = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
        var p = C.untilNextMidnight(now);
        eq(p.h * 3600000 + p.m * 60000 + p.s * 1000,
          Math.ceil((next.getTime() - now) / 1000) * 1000, 'sample ' + k);
        ok(p.m >= 0 && p.m < 60, 'minutes in range');
        ok(p.s >= 0 && p.s < 60, 'seconds in range');
        /* 26, not 25: Antarctica/Troll shifts two hours at once, so its
           fall-back day is 26 hours long and the clock says so. */
        ok(p.h >= 0 && p.h <= 26, 'hours in range');
      }
    });

  test('the day number and the clock roll over on the same tick', function () {
    var eve = localMidnight(2026, 8, 15) - 1000;   // 23:59:59 on the 14th
    eq(C.daysFrom(eve, '2026-08-01'), -13);
    eq(C.formatClock(C.untilNextMidnight(eve)), '1 s');
    var after = eve + 1000;
    eq(C.daysFrom(after, '2026-08-01'), -14);
    ok(C.untilNextMidnight(after).h >= 22, 'clock restarts at a full day');
  });

  /* A floored countdown is a second short all the way down and then parks
     on 00 s for a whole second while the number above it does not move. */
  test('the seconds line counts down to 01 s and never sits on 00',
    function () {
      var midnight = localMidnight(2026, 8, 15);
      for (var ms = 1; ms <= 3500; ms += 37) {
        var p = C.untilNextMidnight(midnight - ms);
        ok(p.s !== 0 || p.m !== 0 || p.h !== 0,
          'zero clock with ' + ms + ' ms left');
        eq(p.s, Math.ceil(ms / 1000), ms + ' ms left');
      }
      eq(C.formatClock(C.untilNextMidnight(midnight - 900)),
        '1 s');
      eq(C.formatClock(C.untilNextMidnight(midnight - 1)), '1 s');
      eq(C.formatClock(C.untilNextMidnight(midnight - 10400)), '11 s');
    });

  /* The figure above this line reads Today, not a number, so "This number
     changes in ..." was about something that was not on the screen. */
  test('the today line does not talk about a number', function () {
    var parts = { h: 20, m: 16, s: 18 };
    eq(C.tickLine(0, parts), 'Today ends in 20 h 16 m 18 s.');
    ok(C.tickLine(0, parts).indexOf('number') === -1, 'names a number');
  });

  test('every other state keeps the wording it had', function () {
    var parts = { h: 3, m: 59, s: 48 };
    eq(C.tickLine(-20845, parts), 'This number changes in 3 h 59 m 48 s.');
    eq(C.tickLine(1, parts), 'This number changes in 3 h 59 m 48 s.');
    eq(C.tickLine(-1, parts), 'This number changes in 3 h 59 m 48 s.');
  });

  test('the tick line is a sentence in both branches', function () {
    var days = [-20845, -1, 0, 1, 4000];
    var parts = { h: 0, m: 0, s: 55 };
    for (var k = 0; k < days.length; k++) {
      var line = C.tickLine(days[k], parts);
      eq(line.charAt(line.length - 1), '.', line);
      ok(line.indexOf('55 s') !== -1, line);
      ok(line.indexOf('00 h') === -1, 'a clock display, not prose: ' + line);
    }
  });

  test('formatClock drops empty leading units and their zeros', function () {
    eq(C.formatClock({ h: 0, m: 0, s: 55 }), '55 s');
    eq(C.formatClock({ h: 0, m: 0, s: 9 }), '9 s');
    eq(C.formatClock({ h: 0, m: 0, s: 0 }), '0 s');
    eq(C.formatClock({ h: 0, m: 5, s: 9 }), '5 m 09 s');
    eq(C.formatClock({ h: 3, m: 59, s: 48 }), '3 h 59 m 48 s');
    eq(C.formatClock({ h: 23, m: 59, s: 59 }), '23 h 59 m 59 s');
    eq(C.formatClock({ h: 24, m: 0, s: 0 }), '24 h 00 m 00 s');
  });

  /* A caption that stops mid-word with no mark on it reads as a typo, not
     as a cut. The mark is on the caption only — the stored title is what
     goes in the hash and has to round-trip. */
  test('a shortened title is shown with a cut marker', function () {
    eq(C.caption('cut here', true), 'cut here\u2026');
    eq(C.caption('cut here', false), 'cut here');
    eq(C.caption('', true), '');
    eq(C.caption(null, true), '');
    eq(C.caption(undefined, false), '');
  });

  test('the marker is not stored, hashed or counted', function () {
    var long = '';
    while (long.length < 150) long += 'word ';
    var read = C.parseHash('#t=' + encodeURIComponent(long) + '&d=2026-01-01');
    ok(read.shortened, 'parseHash reports the cut');
    eq(read.title.length, C.MAX_TITLE);
    eq(C.caption(read.title, read.shortened).length, C.MAX_TITLE + 1);
    ok(read.title.indexOf('\u2026') === -1, 'marker stored');
    ok(C.serialiseHash(read).indexOf('%E2%80%A6') === -1, 'marker hashed');
    /* Re-reading the link the page writes must not grow a second marker. */
    eq(C.parseHash(C.serialiseHash(read)).shortened, false);
  });

  test('a title that fits reports no cut', function () {
    eq(C.parseHash('#t=Moon%20landing&d=1969-07-20').shortened, false);
    eq(C.parseHash('#d=1969-07-20').shortened, false);
    eq(C.parseHash('').shortened, false);
  });

  /* ---- wording --------------------------------------------------------- */

  test('one day is singular in both directions', function () {
    eq(C.phrase(-1).figure, '1');
    eq(C.phrase(-1).unit, 'day since');
    eq(C.phrase(1).figure, '1');
    eq(C.phrase(1).unit, 'day until');
  });

  test('other counts are plural', function () {
    eq(C.phrase(-2).unit, 'days since');
    eq(C.phrase(2).unit, 'days until');
    eq(C.phrase(-20844).unit, 'days since');
    eq(C.phrase(365).unit, 'days until');
    eq(C.phrase(-365).figure, '365');
  });

  test('today reads as today, with no number and no minus sign', function () {
    eq(C.phrase(0).figure, 'Today');
    eq(C.phrase(0).plain, 'Today');
    eq(C.phrase(0).unit, '');
  });

  /* The figure is the product. Ungrouped, 2912217 has to be counted with a
     finger. The separator is a thin space because a comma and a full stop
     mean opposite things depending on where the reader is. */
  test('the figure is grouped in threes with a thin space', function () {
    eq(C.phrase(-20845).figure, '20 845');
    eq(C.phrase(-2912217).figure, '2 912 217');
    eq(C.phrase(1000).figure, '1 000');
    eq(C.phrase(-999).figure, '999');
    eq(C.phrase(-100).figure, '100');
    eq(C.phrase(-1).figure, '1');
  });

  test('the spoken figure keeps bare digits', function () {
    eq(C.phrase(-2912217).plain, '2912217');
    eq(C.phrase(20845).plain, '20845');
    eq(C.phrase(-7).plain, '7');
    for (var n = -3000; n <= 3000; n += 7) {
      var p = C.phrase(n);
      eq(p.plain.replace(/ /g, ''), p.plain, 'no thin space in ' + p.plain);
      eq(p.figure.replace(/ /g, ''), p.plain, 'same digits either way');
    }
  });

  test('no wording ever contains a minus sign, NaN or Invalid Date',
    function () {
      for (var n = -400; n <= 400; n++) {
        var p = C.phrase(n);
        var text = p.figure + ' ' + p.unit;
        ok(text.indexOf('-') === -1, 'minus in ' + text);
        ok(text.indexOf('NaN') === -1, 'NaN in ' + text);
        ok(text.indexOf('Invalid') === -1, 'Invalid in ' + text);
      }
    });

  /* ---- title clamping -------------------------------------------------- */

  test('a 10,000-character title is clamped and flagged', function () {
    var long = new Array(10001).join('x');
    eq(long.length, 10000);
    var r = C.clampTitle(long);
    eq(r.text.length, C.MAX_TITLE);
    eq(r.truncated, true);
  });

  test('titles at or under the cap are left alone', function () {
    var exact = new Array(C.MAX_TITLE + 1).join('y');
    eq(C.clampTitle(exact).truncated, false);
    eq(C.clampTitle(exact).text.length, C.MAX_TITLE);
    eq(C.clampTitle('').text, '');
    eq(C.clampTitle('').truncated, false);
    eq(C.clampTitle(null).text, '');
    eq(C.clampTitle(undefined).text, '');
  });

  /* The hole B1 lived in: clamping was tested, serialising was tested, and
     a clamped title was never handed to serialiseHash. Cutting 120 UTF-16
     units through an emoji leaves a lone surrogate, and encodeURIComponent
     throws URIError on one — which killed the whole page, not just the
     title. */
  test('a clamped title always survives serialiseHash', function () {
    var tail = ['🎉', '👍🏽', '🇳🇿', '👩‍👩‍👧', 'é', '日', 'x'];
    for (var t = 0; t < tail.length; t++) {
      for (var pre = 114; pre <= 122; pre++) {
        var title = new Array(pre + 1).join('x') + tail[t] + 'tail🎂';
        var clamped = C.clampTitle(title);
        var hash;
        try {
          hash = C.serialiseHash({ title: clamped.text, date: '2026-01-01' });
        } catch (e) {
          throw new Error('serialiseHash threw on a title clamped at ' +
            pre + ' + ' + tail[t] + ': ' + e);
        }
        var back = C.parseHash(hash);
        eq(back.title, clamped.text, 'round trip at ' + pre + ' ' + tail[t]);
        eq(back.date, '2026-01-01', 'date survived');
      }
    }
  });

  test('a clamped title never ends in half a surrogate pair', function () {
    var base = new Array(200).join('🎉');       // every char pair is one emoji
    for (var cut = 0; cut < 200; cut++) {
      var text = C.clampTitle(base.slice(0, cut)).text;
      for (var i = 0; i < text.length; i++) {
        var c = text.charCodeAt(i);
        if (c >= 0xd800 && c <= 0xdbff) {
          var low = text.charCodeAt(i + 1);
          ok(low >= 0xdc00 && low <= 0xdfff, 'lone high surrogate at ' + cut);
          i++;
        } else {
          ok(!(c >= 0xdc00 && c <= 0xdfff), 'lone low surrogate at ' + cut);
        }
      }
      C.serialiseHash({ title: text, date: '2026-01-01' });   // must not throw
    }
  });

  /* Defence in depth: a lone surrogate that arrives already broken must not
     be handed on to encodeURIComponent either. */
  test('a lone surrogate in a title is dropped, not passed on', function () {
    eq(C.clampTitle('a\uD800b').text, 'ab');
    eq(C.clampTitle('a\uDFFFb').text, 'ab');
    eq(C.clampTitle('\uD800').text, '');
    eq(C.clampTitle('ok\uD83C').text, 'ok');
    eq(C.clampTitle('🎉 kept').text, '🎉 kept');
    var hash = C.serialiseHash({
      title: C.clampTitle('half\uD800pair').text, date: '2026-01-01'
    });
    eq(C.parseHash(hash).title, 'halfpair');
  });

  test('the cap counts code points, not UTF-16 units', function () {
    var emoji = new Array(C.MAX_TITLE + 1).join('🎉');   // 120 emoji
    var r = C.clampTitle(emoji);
    eq(r.truncated, false, '120 emoji fit');
    eq(r.text, emoji);
    var over = C.clampTitle(emoji + '🎉');
    eq(over.truncated, true);
    eq(over.text, emoji);
  });

  /* A caption of three spaces is a blank line, but it still wrote
     #t=%20%20%20 into the link and "  — 2357 days since · countup" into
     the tab, em dash and all. */
  test('a title of nothing but spaces is no title', function () {
    eq(C.clampTitle('   ').text, '');
    eq(C.clampTitle('   ').truncated, false);
    eq(C.clampTitle('\t\n ').text, '');
    eq(C.clampTitle(' ').text, '');
    eq(C.clampTitle(new Array(400).join(' ')).text, '');
    eq(C.parseHash('#t=%20%20%20&d=2020-01-01').title, '');
    eq(C.serialiseHash(C.parseHash('#t=%20%20%20&d=2020-01-01')),
      '#d=2020-01-01');
    /* Spaces around a real title are still the visitor's business. */
    eq(C.clampTitle('  padded  ').text, '  padded  ');
    eq(C.clampTitle(' . ').text, ' . ');
  });

  /* ---- control characters in a title ----------------------------------- */

  /* A newline used to reach the caption but not the single-line field, so
     the field and the state disagreed and the first keystroke silently
     rewrote the hash. */
  test('control characters become spaces', function () {
    eq(C.clampTitle('line\nbreak').text, 'line break');
    eq(C.clampTitle('tab\tsep').text, 'tab sep');
    eq(C.clampTitle('crlf\r\nhere').text, 'crlf here');
    eq(C.clampTitle('bell\u0007null\u0000').text, 'bell null ');
    eq(C.clampTitle('u2028\u2028sep').text, 'u2028 sep');
    eq(C.clampTitle('plain').text, 'plain');
    eq(C.clampTitle('  padded  ').text, '  padded  ');
  });

  test('a newline in the hash agrees with the field and the hash', function () {
    var r = C.parseHash('#t=line%0Abreak&d=2026-08-14');
    eq(r.title, 'line break');
    /* what the field would hold is what the state holds, so writing it back
       out changes nothing */
    var again = C.parseHash(C.serialiseHash(r));
    eq(again.title, r.title, 'stable second time round');
    eq(C.serialiseHash(again), C.serialiseHash(r), 'hash is stable');
  });

  /* ---- hash parsing: the spec's garbage list --------------------------- */

  test('a good hash parses', function () {
    var r = C.parseHash('#t=Moon%20landing&d=1969-07-20');
    eq(r.title, 'Moon landing');
    eq(r.date, '1969-07-20');
    eq(r.notes.length, 0);
  });

  test('no hash at all is not an error', function () {
    var r = C.parseHash('');
    eq(r.title, ''); eq(r.date, ''); eq(r.notes.length, 0);
    eq(C.parseHash('#').notes.length, 0);
    eq(C.parseHash(null).date, '');
    eq(C.parseHash(undefined).date, '');
  });

  test('#d=banana names the shape it wanted, by example', function () {
    var r = C.parseHash('#d=banana');
    eq(r.date, '');
    has(r.notes, '2026-12-25');
    for (var i = 0; i < r.notes.length; i++) {
      ok(r.notes[i].indexOf('YYYY') === -1, 'no format jargon in a note');
    }
  });

  test('#d=2026-02-31 says it is not a real date', function () {
    var r = C.parseHash('#d=2026-02-31');
    eq(r.date, '');
    has(r.notes, 'not a real date');
  });

  test('a missing d says so and keeps the title', function () {
    var r = C.parseHash('#t=Hello');
    eq(r.title, 'Hello');
    eq(r.date, '');
    has(r.notes, 'no date');
  });

  /* A title is optional, so its absence is not news. The note it used to
     get was printed above the real problem on a link that had one. */
  test('a missing t is not reported at all', function () {
    var r = C.parseHash('#d=2026-01-01');
    eq(r.title, '');
    eq(r.date, '2026-01-01');
    eq(r.notes.length, 0);
  });

  test('a broken date is the first thing said about a broken link',
    function () {
      var r = C.parseHash('#d=banana');
      eq(r.notes.length, 1);
      has(r.notes, 'date');
      var r2 = C.parseHash('#d=2026-02-31');
      eq(r2.notes.length, 1);
      has(r2.notes, 'not a real date');
    });

  test('a 10,000-character title in the hash is clamped', function () {
    var long = new Array(10001).join('z');
    var r = C.parseHash('#t=' + long + '&d=2026-01-01');
    eq(r.title.length, C.MAX_TITLE);
    eq(r.date, '2026-01-01');
    has(r.notes, 'shortened');
  });

  test('a script tag stays literal text', function () {
    var r = C.parseHash('#t=%3Cscript%3Ealert(1)%3C%2Fscript%3E&d=2026-01-01');
    eq(r.title, '<script>alert(1)<\/script>');
    var r2 = C.parseHash('#t=<script>alert(1)<\/script>&d=2026-01-01');
    eq(r2.title, '<script>alert(1)<\/script>');
  });

  test('raw junk with no = at all leaves an empty, usable state', function () {
    var r = C.parseHash('#justsomejunk');
    eq(r.title, ''); eq(r.date, '');
    has(r.notes, 'no counter');
    var r2 = C.parseHash('#&&&');
    eq(r2.date, '');
    ok(r2.notes.length > 0, 'says something');
  });

  test('a broken percent escape is reported, not thrown', function () {
    var r = C.parseHash('#t=%E0%A4%A&d=2026-01-01');
    eq(r.date, '2026-01-01');
    has(r.notes, 'could not be read');
    var r2 = C.parseHash('#t=100%&d=%');
    eq(r2.date, '');
    ok(r2.notes.length > 0, 'says something');
  });

  test('empty values behave like missing ones', function () {
    var r = C.parseHash('#t=&d=');
    eq(r.title, ''); eq(r.date, '');
    eq(r.notes.length, 1);
    has(r.notes, 'no date');
  });

  test('unknown keys are ignored', function () {
    var r = C.parseHash('#x=1&t=Ok&d=2026-01-01&zz=%%%');
    eq(r.title, 'Ok');
    eq(r.date, '2026-01-01');
  });

  test('order does not matter and the last value of a key wins', function () {
    eq(C.parseHash('#d=2026-01-01&t=Ok').title, 'Ok');
    eq(C.parseHash('#d=2026-01-01&d=banana').date, '');
    eq(C.parseHash('#d=banana&d=2026-01-01').date, '2026-01-01');
  });

  test('no parse result ever contains NaN or Invalid Date', function () {
    var junk = ['#d=banana', '#d=2026-02-31', '#t=Hello', '#d=2026-01-01',
      '#justsomejunk', '#t=%E0%A4%A', '#t=&d=', '#=', '#&=&', '#t',
      '#d=0000-00-00', '#d=9999-99-99', '#d=NaN', '#d=Invalid%20Date',
      '#t=' + new Array(10001).join('q')];
    for (var k = 0; k < junk.length; k++) {
      var r = C.parseHash(junk[k]);
      var text = r.title + ' ' + r.date + ' ' + r.notes.join(' ');
      ok(text.indexOf('NaN') === -1, 'NaN from ' + junk[k]);
      ok(text.indexOf('Invalid Date') === -1, 'Invalid Date from ' + junk[k]);
      eq(typeof r.title, 'string');
      eq(typeof r.date, 'string');
    }
  });

  /* ---- hash round trips ------------------------------------------------ */

  test('titles with hash-breaking characters survive a round trip',
    function () {
      var titles = ['Moon landing', 'a&b', 'x=y', '#hashtag', '100%',
        '50% & 50=100', '🎉 party 🎂', '  padded  ',
        '&d=2020-01-01', '?query#frag', 'quote "and" \'apostrophe\'',
        'плюс日本語', 'a+b', 'back\\slash', 'semi;colon,comma',
        '<script>alert(1)<\/script>'];
      for (var k = 0; k < titles.length; k++) {
        var state = { title: titles[k], date: '2026-08-14' };
        var hash = C.serialiseHash(state);
        ok(hash.indexOf(' ') === -1, 'no raw space in ' + hash);
        var back = C.parseHash(hash);
        eq(back.title, titles[k], 'title round trip');
        eq(back.date, '2026-08-14', 'date round trip for ' + titles[k]);
        eq(back.notes.length, 0, 'clean round trip for ' + titles[k]);
      }
    });

  test('a round trip also survives the browser normalising the hash',
    function () {
      var state = { title: 'a&b=c#d 100% 🎉', date: '2024-02-29' };
      var back = C.parseHash(decodeURI(encodeURI(C.serialiseHash(state))));
      eq(back.title, state.title);
      eq(back.date, state.date);
    });

  test('serialise omits empty halves', function () {
    eq(C.serialiseHash({ title: '', date: '' }), '');
    eq(C.serialiseHash({ title: 'Only', date: '' }), '#t=Only');
    eq(C.serialiseHash({ title: '', date: '2026-01-01' }), '#d=2026-01-01');
    eq(C.serialiseHash(null), '');
    eq(C.serialiseHash(undefined), '');
  });

  test('serialise then parse is stable a second time', function () {
    var state = { title: 'twice & again', date: '2026-12-25' };
    var once = C.serialiseHash(state);
    var twice = C.serialiseHash(C.parseHash(once));
    eq(twice, once);
  });

  /* ---- report ---------------------------------------------------------- */

  var total = passed + failed;
  var line = (failed === 0 ? 'PASS ' + passed : 'FAIL ' + failed) +
    '/' + total;
  document.title = line;
  document.getElementById('count').textContent = line +
    ' (' + passed + ' passed, ' + failed + ' failed)';

  try {
    document.getElementById('zone').textContent = 'timezone: ' +
      (Intl.DateTimeFormat().resolvedOptions().timeZone || 'unknown') +
      ' · offset now: ' + (-new Date().getTimezoneOffset()) + ' min';
  } catch (e) { /* Intl is optional here */ }

  var list = document.getElementById('failures');
  for (var f = 0; f < failures.length; f++) {
    var li = document.createElement('li');
    li.className = 'fail';
    li.textContent = failures[f];
    list.appendChild(li);
  }
})();
</script>
</body>
</html>
