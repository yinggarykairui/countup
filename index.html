<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>countup — a days-since page whose state is in the link</title>
<meta name="description" content="A days-since page whose whole state is in the link. Set a title and a date, send the URL, and the other person sees the same counter.">
<style>
/* Contrast, measured against the page background #fbfaf7:
   ink #141414 17.65:1 · muted #5f5b54 6.47:1 · field rule #8a8578 3.53:1 ·
   focus ring #2b5c9a 6.49:1. Button text #fbfaf7 on #141414 is 17.65:1.
   Body text needs 4.5:1, meaningful marks 3:1. All clear. */
:root {
  --bg: #fbfaf7;
  --ink: #141414;
  --muted: #5f5b54;
  --line: #8a8578;
  --focus: #2b5c9a;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
    "Helvetica Neue", Arial, sans-serif;
  line-height: 1.5;
}
/* min-height, never height: a short viewport must fall back to ordinary
   document scrolling. "safe center" keeps tall content from being centred
   off the top of the screen; browsers without it drop the whole rule and
   start at the top, which is also fine. */
main {
  max-width: 34rem;
  min-height: 100vh;
  margin: 0 auto;
  padding: clamp(1.5rem, 6vw, 3rem) clamp(1rem, 5vw, 2rem);
  display: flex;
  flex-direction: column;
  justify-content: safe center;
  gap: clamp(1.5rem, 5vw, 2.25rem);
}
/* The page needs one stable heading. The counter's own title is caption
   text below it, because that string comes from a stranger's link. */
.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  margin: -1px; padding: 0; border: 0;
  clip-path: inset(50%);
  overflow: hidden;
  white-space: nowrap;
}
/* The page name is a screen-reader heading while a counter is on screen —
   the counter is the product, not the brand. With no counter there is
   nothing else to look at, so it becomes the visible name of the page and
   brings one sentence of explanation with it. display: contents keeps the
   wrapper out of the flex layout (and out of its gaps) the rest of the
   time. */
#intro { display: contents; }
main.empty #intro { display: block; }
main.empty #pagename {
  position: static;
  width: auto; height: auto;
  margin: 0;
  clip-path: none;
  overflow: visible;
  white-space: normal;
  font-size: clamp(1.5rem, 7vw, 2rem);
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.15;
}
#lede {
  margin: 0.5rem 0 0;
  max-width: 30rem;
  font-size: 1rem;
  color: var(--muted);
}
.caption {
  margin: 0 0 0.35rem;
  font-size: clamp(1rem, 4vw, 1.1875rem);
  font-weight: 500;
  letter-spacing: 0.01em;
  color: var(--muted);
  overflow-wrap: anywhere;
}
/* The figure is sized off whichever axis is scarcer. Keyed off vw alone it
   reached 7rem on a 844px-wide landscape phone and pushed the date field
   and the copy button off a 390px-tall screen. */
.figure {
  margin: 0;
  font-size: clamp(2.75rem, min(14vw, 22vh), 7rem);
  line-height: 0.95;
  font-weight: 600;
  letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}
.unit {
  margin: 0.35rem 0 0;
  font-size: clamp(1rem, 4.5vw, 1.375rem);
  color: var(--muted);
}
.tick {
  margin: 0.9rem 0 0;
  font-size: 0.9375rem;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.notes p, .status {
  margin: 0;
  font-size: 0.9375rem;
  color: var(--muted);
}
.notes p + p { margin-top: 0.25rem; }
.notes:empty { display: none; }
form { display: grid; gap: 1rem; margin: 0; }
label {
  display: block;
  margin-bottom: 0.3rem;
  font-size: 0.8125rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}
/* 44px is the floor for anything a thumb has to hit. */
input {
  width: 100%;
  min-width: 0;
  min-height: 44px;
  padding: 0.55rem 0.65rem;
  font: inherit;
  font-size: 1rem;
  color: var(--ink);
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 2px;
}
.share { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; }
button {
  min-height: 44px;
  padding: 0.55rem 1rem;
  font: inherit;
  font-size: 0.9375rem;
  color: var(--bg);
  background: var(--ink);
  border: 1px solid var(--ink);
  border-radius: 2px;
  cursor: pointer;
}
.url {
  margin: 0;
  padding: 0.5rem 0.6rem;
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.8125rem;
  color: var(--ink);
  background: #fff;
  border: 1px solid var(--line);
  overflow-wrap: anywhere;
}
footer {
  font-size: 0.8125rem;
  color: var(--muted);
  border-top: 1px solid var(--line);
  padding-top: 0.75rem;
}
/* A landscape phone has vertical room for about one thing. Tighten the
   frame rather than the content; portrait and desktop are untouched. */
@media (orientation: landscape) and (max-height: 30rem) {
  main {
    padding-top: 1rem;
    padding-bottom: 1rem;
    gap: 1rem;
  }
}
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div id="intro">
    <h1 class="sr-only" id="pagename">countup</h1>
    <p id="lede" hidden>Pick a date below and this page counts the whole days
      since it, or until it — the whole counter lives in the link, so sending
      the URL sends the counter.</p>
  </div>

  <section id="counter" hidden>
    <p class="caption" id="title"></p>
    <p class="figure" id="figure" aria-hidden="true"></p>
    <p class="unit" id="unit" aria-hidden="true"></p>
    <p class="tick" id="tick"></p>
  </section>

  <!-- The counter's sentence, announced once when it changes. The figure and
       the unit above are aria-hidden so it is not read twice, and the ticking
       line is deliberately outside this region: it must not be announced
       every second. -->
  <p class="sr-only" id="announce" aria-live="polite"></p>

  <div class="notes" id="notes" aria-live="polite"></div>

  <form id="editor" autocomplete="off">
    <div>
      <label for="title-input">Title</label>
      <input id="title-input" type="text" maxlength="120" spellcheck="false">
    </div>
    <div>
      <label for="date-input">Date</label>
      <!-- The counter can only render a four-digit year, so the field is not
           allowed to hold anything else. -->
      <input id="date-input" type="date" min="0001-01-01" max="9999-12-31">
    </div>
  </form>

  <div class="share">
    <button type="button" id="copy">Copy link</button>
    <p class="status" id="status" aria-live="polite"></p>
  </div>
  <p class="url" id="url" hidden></p>

  <footer>The counter lives in the link. Nothing is stored.</footer>
</main>

<script src="countup.js"></script>
<script>
(function () {
  'use strict';

  var C = window.Countup;
  var BASE_TITLE = document.title;

  var el = {
    main: document.querySelector('main'),
    lede: document.getElementById('lede'),
    counter: document.getElementById('counter'),
    announce: document.getElementById('announce'),
    title: document.getElementById('title'),
    figure: document.getElementById('figure'),
    unit: document.getElementById('unit'),
    tick: document.getElementById('tick'),
    notes: document.getElementById('notes'),
    titleInput: document.getElementById('title-input'),
    dateInput: document.getElementById('date-input'),
    copy: document.getElementById('copy'),
    status: document.getElementById('status'),
    url: document.getElementById('url')
  };

  var state = { title: '', date: '' };
  var notes = [];
  var timer = null;
  var writingHash = false;
  var announced = '';
  var statusTimer = null;

  /* Every string below reaches the page through textContent. User text is
     never parsed as markup. */
  function setNotes(list) {
    if (list.join('\n') === notes.join('\n')) return;
    notes = list;
    while (el.notes.firstChild) el.notes.removeChild(el.notes.firstChild);
    for (var i = 0; i < list.length; i++) {
      var p = document.createElement('p');
      p.textContent = list[i];
      el.notes.appendChild(p);
    }
  }

  /* The counter's sentence, once, when it changes. Re-writing the same text
     would make a screen reader say it again for nothing, and the ticking
     line is never sent here — a countdown announced every second is a
     countdown nobody can listen past. */
  function announce(sentence) {
    if (sentence === announced) return;
    announced = sentence;
    el.announce.textContent = sentence;
  }

  /* With no counter to show, the page says what it is and what to do. */
  function showIntro(on) {
    if (el.main.classList.contains('empty') === on) return;
    el.main.classList.toggle('empty', on);
    el.lede.hidden = !on;
  }

  function render(nowMs) {
    if (!state.date) {
      el.counter.hidden = true;
      showIntro(true);
      announce('');
      document.title = BASE_TITLE;
      return;
    }
    var days = C.daysFrom(nowMs, state.date);
    if (days === null) {          // unreachable: state.date is validated
      el.counter.hidden = true;
      showIntro(true);
      announce('');
      return;
    }
    var said = C.phrase(days);
    el.counter.hidden = false;
    showIntro(false);
    announce(said.unit ? said.figure + ' ' + said.unit + '.' : said.figure + '.');
    el.title.hidden = state.title === '';
    el.title.textContent = state.title;
    el.figure.textContent = said.figure;
    el.unit.textContent = said.unit;
    el.unit.hidden = said.unit === '';
    el.tick.textContent = 'Next day in ' +
      C.formatClock(C.untilNextMidnight(nowMs)) + '.';
    document.title = (state.title ? state.title + ' — ' : '') +
      (said.unit ? said.figure + ' ' + said.unit : 'today') + ' · countup';
  }

  /* The address bar is a convenience; the counter on screen is the product.
     Anything that goes wrong writing the hash is swallowed here so that one
     bad string can never stop the page from rendering or ticking. */
  function writeHash() {
    try {
      var hash = C.serialiseHash(state);
      if (hash === location.hash ||
          (hash === '' && location.hash === '#')) return;
      var base = location.href.split('#')[0];
      try {
        history.replaceState(null, '', base + hash);
      } catch (e) {
        /* Some browsers refuse replaceState on file:// URLs. */
        writingHash = true;
        location.hash = hash.replace(/^#/, '');
        writingHash = false;
      }
    } catch (e) {
      writingHash = false;
    }
  }

  function loadFromHash() {
    var read;
    try {
      read = C.parseHash(location.hash);
    } catch (e) {
      read = { title: '', date: '', notes: ['That link could not be read.'] };
    }
    state.title = read.title;
    state.date = read.date;
    el.titleInput.value = state.title;
    el.dateInput.value = state.date;
    setNotes(read.notes);
    /* The old status was about the old link. */
    setStatus('');
    el.url.hidden = true;
    /* Rewrite anything the link got wrong — a clamped title, a date that is
       not a date — so the address bar always reproduces the screen and the
       copy button hands on a link that works. The notes say what changed. */
    writeHash();
    render(Date.now());
  }

  /* A date field can hold a year of five or more digits — one stray keystroke
     turns 2026 into 20260 — and the counter has no way to show that. Say
     which part is wrong instead of asking for a date that is already
     typed in. */
  function dateProblem(typed) {
    var v = el.dateInput.validity;
    var m = /^(\d+)-(\d{2})-(\d{2})$/.exec(typed);
    /* badInput: the field is showing something it cannot hand over as a
       date, which is what a five-digit year looks like from here. */
    if ((typed === '' && v && v.badInput) ||
        (m && (m[1].length > 4 || +m[1] < 1))) {
      return 'That year is out of range. Use a year between 0001 and 9999.';
    }
    if (typed === '') return 'Pick a date to start the counter.';
    return 'That date cannot be used. Pick another one.';
  }

  function onEdit() {
    var clamped = C.clampTitle(el.titleInput.value);
    state.title = clamped.text;
    var typed = el.dateInput.value;
    state.date = C.isValidDate(typed) ? typed : '';
    setNotes(state.date ? [] : [dateProblem(typed)]);
    setStatus('');
    el.url.hidden = true;
    writeHash();
    render(Date.now());
  }

  /* One interval, one Date.now() per tick, so the day number and the clock
     can never disagree at a midnight rollover. */
  function start() {
    if (timer !== null) return;
    timer = setInterval(function () {
      try {
        render(Date.now());
      } catch (e) { /* a dead tick must not become a dead page */ }
    }, 1000);
  }

  function stop() {
    if (timer === null) return;
    clearInterval(timer);
    timer = null;
  }

  function selectText(node) {
    try {
      var range = document.createRange();
      range.selectNodeContents(node);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    } catch (e) { /* selection is a convenience, not a requirement */ }
  }

  /* Cleared first, then set on the next turn: pressing Copy twice produces
     the same sentence, and a live region that is handed the text it already
     holds says nothing at all. */
  function setStatus(text) {
    if (statusTimer !== null) {
      clearTimeout(statusTimer);
      statusTimer = null;
    }
    el.status.textContent = '';
    if (text === '') return;
    statusTimer = setTimeout(function () {
      statusTimer = null;
      el.status.textContent = text;
    }, 50);
  }

  function copyFallback() {
    el.url.textContent = location.href;
    el.url.hidden = false;
    selectText(el.url);
    setStatus('Copy was refused. The link is selected below — ' +
      'press Ctrl+C or Cmd+C.');
  }

  el.copy.addEventListener('click', function () {
    /* The button's one job is handing on a counter. With no date there is no
       counter, and saying "Link copied." would be a lie about a blank page. */
    if (!state.date) {
      el.url.hidden = true;
      setStatus('Pick a date first — there is nothing to share yet.');
      return;
    }
    var url = location.href;
    var done = function () {
      el.url.hidden = true;
      setStatus('Link copied.');
    };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(done, copyFallback);
      } else {
        copyFallback();
      }
    } catch (e) {
      copyFallback();
    }
  });

  el.titleInput.addEventListener('input', onEdit);
  el.dateInput.addEventListener('input', onEdit);
  el.dateInput.addEventListener('change', onEdit);

  window.addEventListener('hashchange', function () {
    if (writingHash) return;
    loadFromHash();
  });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) {
      stop();
    } else {
      render(Date.now());
      start();
    }
  });

  /* start() runs whatever the link said. A counter that cannot be read is a
     page with an empty form on it, not a page that never wakes up. */
  try {
    loadFromHash();
  } catch (e) {
    setNotes(['That link could not be read.']);
  }
  start();
})();
</script>
</body>
</html>
